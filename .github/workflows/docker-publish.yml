name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dandan658/baidu-autosave-docker

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test startup, scheduler, UI and login
        env:
          TEST_IMAGE: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
        run: bash scripts/smoke-test.sh "$TEST_IMAGE"

  publish:
    name: Publish multi-platform tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge tested architecture images
        shell: bash
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$IMAGE:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:build-$GITHUB_SHA-amd64" \
            "$IMAGE:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA:0:12}"
          echo "Published: $IMAGE:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: linux/amd64, linux/arm64' >> "$GITHUB_STEP_SUMMARY"

