services:
  baidu-autosave:
    build: .
    image: baidu-autosave-subscription:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5000}:5000"
    environment:
      TZ: Asia/Shanghai
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data/config:/app/config
      - ./data/log:/app/log
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
